<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/favicon.svg"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/favicon_light.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/images/favicon.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/images/favicon_light.png"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Dashboard Shell</title>
    <meta name="title" content="Dashboard Shell" />
    <meta
      name="description"
      content="Dashboard Shell provides a unified operations and reporting view for AAWM services."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="/" />
    <meta property="og:title" content="Dashboard Shell" />
    <meta
      property="og:description"
      content="Dashboard Shell provides a unified operations and reporting view for AAWM services."
    />
    <meta property="og:image" content="/images/favicon.svg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="/" />
    <meta property="twitter:title" content="Dashboard Shell" />
    <meta
      property="twitter:description"
      content="Dashboard Shell provides a unified operations and reporting view for AAWM services."
    />
    <meta property="twitter:image" content="/images/favicon.svg" />

    <!-- font family: CSS now uses same-origin/system fallback stacks only. -->

    <meta name="theme-color" content="#fff" />
  </head>

  <body>
    <div id="root"></div>
    <script defer src="/bootstrap-watchdog.js"></script>
    <script defer type="module" src="/src/main.tsx"></script>
  </body>
</html>
